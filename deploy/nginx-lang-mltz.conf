server {
    listen 80;
    listen [::]:80;
    server_name lang.mltz.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lang.mltz.tech;

    # Cloudflare Origin Certificate (wildcard *.mltz.tech — shared with the
    # other sites on this box, e.g. faro-mltz). Do not provision a new cert.
    ssl_certificate /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /home/carlos/langlsrw/public;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/tab-separated-values text/plain;
    gzip_min_length 512;

    # index.html, manifests, materials: always revalidate (cheap 304s), so a
    # deploy's new ?v= stamps are picked up immediately.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Every URL below is content-versioned by deploy/deploy.sh (?v=<hash>), so
    # it can be cached as immutable. Only add_header (no `expires`), otherwise
    # nginx sends two Cache-Control headers.
    location ~* \.(?:css|js|svg|woff2?|ttf|eot|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Sentence-library data. The stock mime.types has no .tsv entry, which made
    # it application/octet-stream and therefore never gzipped (2.0 MB -> 0.87 MB).
    location ~* \.tsv$ {
        types { }
        default_type text/tab-separated-values;
        charset utf-8;
        charset_types text/tab-separated-values;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
